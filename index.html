<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V Scaleforms</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='5' fill='%23151409'/><text x='16' y='24' font-family='monospace' font-size='22' font-weight='700' text-anchor='middle' fill='%23ffb000'>S</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <!-- Adding a monospaced font for the code -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
</head>
<body>
    <!-- Top bar, solo movil: la lista y el detalle no caben a la vez -->
    <div class="mobile-bar">
        <button type="button" id="index-toggle" class="index-toggle" aria-expanded="false" aria-controls="scaleform-list">INDEX</button>
        <span class="mobile-current" id="mobile-current">HOME</span>
    </div>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>SCALEFORMS</h3>
                <span class="sidebar-count" id="sidebar-count"></span>
            </div>

            <!-- Search bar -->
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search name or function..." class="search-input"
                       autocomplete="off" spellcheck="false">
                <span class="search-hint">/ to focus &middot; enter opens first hit</span>
            </div>

            <!-- Separate HOME button -->
            <div id="home-button" class="home-button">
                HOME
            </div>

            <div class="sidebar-content" id="scaleform-list">
                <!-- Scaleform items will be added here dynamically -->
                <div class="loading">Loading...</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div id="scaleform-details">
                <!-- Scaleform details will be added here dynamically -->
                <div class="loading">Select a scaleform from the menu</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
